tc:
  page_title: "香港泰菜食字店名研究"
  select_lang: "🌐 Switch Language"
  title: "🇹🇭 泰好味＝泰高分？香港泰菜食字店名口碑與人氣之數據分析"
  intro: |
    「**食字**」（諧音雙關）是香港常見的文化現象，其中**泰國餐廳**的命名方式更是大眾津津樂道的話題，有網媒更曾對此進行統計及專題報導。這種命名風格雖然深入民心，但是否能實質轉化為**商業成果**？

    本研究旨在探討「**食字 (Pun-based)**」與「**標準 (Standard)**」命名對餐廳商業表現之影響。在數據採集上，本研究整合了由**食物環境衞生署 (FEHD)** 提供、並透過**空間數據共享平台 (CSDI)** 獲取的**食肆牌照數據**，以及從 **Google Places API** 採集的**評價資訊**（包括評分、評論數量及價格等級）。
  overview_heading: "🍽️ 納入研究之餐廳概覽"
  overview_1: "🔎 店名風格"
  overview_1_insight: |
    * **樣本組成：** 在 {total_restaurants_count} 間納入研究的餐廳中，共有 **{pun_count} 間**以食字（諧音雙關）命名，佔整體樣本 **{pun_percent:.1f}%**，即平均每 **{denominator:.0f} 間**餐廳中就有 1 間以食字命名。
    * **食字範例**：泰簡單、泰好味、泰式食
  overview_2: "📍 地區分佈"
  overview_2_insight: |
    * **地區分佈：** 數據結果與大眾認知吻合，**九龍城**擁有的泰國餐廳數量居全港之冠，惟其食字店名的比例相對較低。
    * **命名趨勢：** 食字比例超過半數的地區包括元朗、荃灣、葵青、北區、屯門、沙田、深水埗、中西區、黃大仙及大埔，反映**食字店名風格較多集中於新界地區**。
  overview_3: "🗺️ 餐廳地圖"
  show_all: "📋 顯示{total_restaurants_count}間泰國餐廳資料"
  data_methodology: "🛠️ 數據處理流程及說明"
  overview_remark: |
    ### ⚙️ 數據獲取與清洗

    * **多源整合**：本研究以 **CSDI 空間數據**為基礎，透過 **Google Places API (New)** 獲取餐廳評分、評論數目及價格等級等關鍵指標。
    * **自動化過濾**：利用 Google API 提供的餐廳種類標籤 (`primary_type` 與 `types`) 進行分類，排除名稱包含「泰」字但非泰國餐廳的數據（例如：*鼎泰豐*、*泰昌餅家* 等）。
    * **人工校對**：針對機器難以識別的邊緣案例及已永久結業之餐廳，進行人工核對、重新命名或移除，確保分析樣本的準確性。
    * **店名分類**：採用自定義邏輯將店名歸納為三大類別：**「標準 (Standard)」**、**「食字 (Pun)」** 及 **「英文 (English)」**。

    ### ⚠️ 數據局限性

    * **樣本偏差**：由於初始數據擷取以「泰 / Thai」作為關鍵詞篩選，樣本可能忽略了店名中不含此關鍵字、但實際上經營泰國菜的餐廳。因此，本報告中的 **食字比例可能略高於全港真實市場水平**。
    * **API 搜索限制**：受限於搜索機制，若 Google 與 CSDI 的店名有較大差異，或在 Google 出現同名餐廳，可能導致對接誤差，**現已手動剔除歧義樣本，唯此舉令樣本量減少，並存在判讀主觀性**。
    * **時效性**：本數據反映截至 **2026年4月** 之市場狀況，尚未反映後續新開業或結業之變動。
  google_heading: "📣 店名風格對口碑與人氣之影響"
  google_1: "⭐ 評分"
  google_1_insight: |
    * **評分表現**：各類店名風格的**評分中位數為 3.9-4.0**。這顯示儘管食字店名在文化層面深入民心，但在實際口碑表現上與標準店名並無顯著差異。
  google_2: "💬 評論數量"
  google_2_insight: |
    * **人氣落差**：食字店名的**平均評論數量顯著低於標準及英文店名**。若以評論數作為人氣指標，統計結果**打破了大眾普遍認為「食字店名具親和力、更能吸客」的直覺**。
  tooltip: "ℹ️\n\n圖表\n\n說明"
  tooltip_boxplot: |
    * **箱形圖 (Boxplot) 說明**：
      * **核心區間**：盒形的下沿、中線與上沿分別代表**第一四分位數 (Lower Quartile/Q1)**、**中位數 (Median/Q2)** 及 **第三四分位數 (Upper Quartile/Q3)**，反映了 50% 店舖的集中分佈範圍。
      * **分佈極限**：延伸出的**觸鬚 (Whiskers)** 展示了數據的正常邊界。**超越上邊界的點 (Outliers)** 代表了具備「爆紅」潛力的高人氣店舖。
  google_remark: |
    ### ⚙️ 數據清洗
    * **異常值處理**：在整合最終分析數據集（$n={total_restaurants_count}$）前，**已剔除2個評分為 0 的無效樣本**。此類樣本通常代表該餐廳尚未累積評分，移除後可確保整體分佈更能反映市場真實口碑。
  price_level_heading: "💰 價格等級是否構成干擾？"
  price_level_insight: |
    * **熱力圖 (Heatmap) 導讀**：
      * **相關性 (Correlation)**：數值介於 -1（完全負相關） 與 1（完全正相關） 之間。
      * **評論與食字**：**評論數量**與**是否食字**呈負相關（$R=-0.21$），即餐廳名字**越傾向食字、評論越少**。
      * **評論與價格**：**評論數量**與**價格等級**呈更強烈正相關（$R=0.55$），即**價格等級會干擾評論數量**。
    * **價格等級分析**：
      * **價格兩極化**：{total_restaurants_count} 間餐廳高度集中於 **平價餐廳 (Level 0)** 及 **中高價餐廳 (Level 3)** 兩端。後續分析將採取「分層策略」，**針對此兩組價格的餐廳進行獨立驗證**。
      * **命名慣例**：食字命名的 **中高價餐廳 (Level 3)** 的佔比明顯低於標準命名，推測平價餐廳更傾向利用食字命名的親和力吸引大眾，而高價位餐廳則較常採用標準或英文命名以建立品牌嚴謹感。
  price_level_1: "熱力圖（各因素相關性）"
  price_level_2: "不同價格等級的餐廳數量"
  price_level_2_1: "🔠 按店名風格"
  price_level_2_2: "📍 按地區"
  price_level_breakdown_heading: "🪙 價格等級分層驗證"
  price_level_breakdown_insight: |
    * **食字表現落差持續**：儘管前述分析指出平價餐廳傾向利用食字建立親和力，但數據顯示，這種命名策略**並未轉化為實際的競爭優勢**。無論在何種價格等級，食字店名的**評分與評論數量仍普遍低於標準命名**，顯示幽默感未必能保證市場人氣。
    * **價格與評論數量關聯持續**：對應熱力圖 (Heatmap) 結果，評論數量與價格等級呈現強烈正相關。此關聯同步反映於中高價餐廳 (Level 3) 評論數量的箱形圖 (Box Plot)：**Level 3 的評論數量高於 Level 0 及整體標準**，而Level 3內，**標準命名的評論數量亦領先**。
    * **後續研究方向**：為排除價格等級造成的干擾，後續分析將繼續拆開平價餐廳 (Level 0) 及中高價餐廳 (Level 3)，並深入探討**不同地區的餐廳**的商業表現。
  price_breakdown_1: "⭐ 評分分佈（按價格等級）"
  price_breakdown_2: "💬 評論數量分佈（按價格等級）"
  price_breakdown_1_1: "整體評分"
  price_breakdown_1_2: "平價餐廳 (Level 0) 評分"
  price_breakdown_1_3: "中高價餐廳 (Level 3) 評分"
  price_breakdown_2_1: "整體評論數量"
  price_breakdown_2_2: "平價餐廳 (Level 0) 評論數量"
  price_breakdown_2_3: "中高價餐廳 (Level 3) 評論數量"
  price_remark: |
    ### 💰 價格等級定義
    
    本研究採用 Google API 的原始價格等級 0 至 4 為基礎，並根據香港市場的消費特性進行以下歸類，以確保分析之商業意義：
    * **Level 0**：定義為**平價餐廳**（原始 API 標籤為 *Free/Unclassified*）。在香港泰菜樣本中，此類別主要涵蓋未設定高昂門檻的大眾化食肆、外賣店或小型餐廳，故在本研究中統稱為「平價餐廳」。
    * **Level 3**：定義為**中高價餐廳**（原始 API 標籤為 *Expensive*），反映了具備一定服務規模與裝潢水平的餐廳。
    * **Level 1,2,4**：因樣本分佈相對分散或極端，僅作為背景數據。
  price_corr_heading: "🧩 數據解密：從平價到高端市場的命名生存學"
  price_corr_insight: |
    * **指標選擇與研究方法**
      * **價格等級分層**：為排除價格定位的干擾，分析沿用**平價餐廳 (Level 0)** 及 **中高價餐廳 (Level 3)** 進行獨立驗證。
      * **聚焦評論數量**：上述熱力圖顯示食字與**評論數量**相關性較強 ($r = -0.21$)，與**評分**則幾乎無關 ($r = -0.04$)。故分析聚焦於評論數，以探討店名對大眾的「吸引力」與「傳播力」。
      * **分析邏輯**：以各區的「食字店名比例」作為核心指標，觀察食字飽和度如何影響該區餐廳的平均人氣（評論數量）。
      * **模型選擇**：選用**RLM（穩健迴歸）** 模型，以確保趨勢線不受極端值 (Outliers) 扭曲。

    * **關鍵發現：創意溢價與平庸陷阱**
      * **Level 0 平價餐廳**：食字店名比例與評論數量呈**負相關**，趨勢線顯示同一區的「食字餐廳」每增加 10% ，它們的**平均評論數量會減少 8.7 條**。反映基層市場中，食字店名可能被聯想為平庸、品牌深度不足，反成為**負面標籤**；或因**同質化嚴重**（如大量「泰XX」），令食客難以分辨，導致食字店名的餐廳人氣隨飽和度下降。
      * **Level 3 中高價餐廳**：趨勢完全反轉，呈**顯著正相關**，趨勢線顯示同一區的「食字餐廳」每增加 10% ，它們的**平均評論數量會增加 29 條**。反映高端消費者更被創意與玩味吸引光顧，食字命名被視為品牌差異化的利器，展現出強大的吸客能力。
      * **極端值辨識**：Level 0 的**旺角區**與 Level 3 的**油尖區**實際評論數遠超模型預測。這反映市中心旺區的「地理優勢」自帶流量，其影響力蓋過命名策略，亦驗證了 RLM 模型排除干擾、捕捉核心趨勢的重要性。
  price_corr_1: "📉 平價餐廳 (Level 0)：食字命名的人氣稀釋效應"
  price_corr_2: "📈 中高價餐廳 (Level 3)：命名創意帶來的品牌溢價"
  show_price_stratification: "📋 顯示各區泰國餐廳價格等級分層"
  price_strat_1: "📉 價格等級：Level 0"
  price_strat_2: "📈 價格等級：Level 3"
  price_corr_remark: |
    ### ⚙️ 數據處理

    * **Level 0 (平價)**：全港原本劃分為 19 區（部分政府數據仍未合併油尖區及旺角區為油尖旺區），但西貢、離島和南區並無符合食字店名定義的平價泰菜餐廳，故最終參與迴歸分析的有效樣本縮減至**16區**。
    * **Level 3 (中高價)**：由於採用食字店名的中高價泰國餐廳樣本量較少，符合統計門檻僅餘**6區**，其趨勢線雖具備統計顯著性（$P < 0.05$），但在泛化到全港市場時需保持審慎，不排除研究結果受個別極端行政區數據影響。

    ### 📊 統計指標釋義

    * **Z 統計量 (Z-statistic)**：
        * **信號強度**：衡量指標的影響力。數值的絕對值越大，代表該命名風格對人氣的影響越顯著，其結果越不可能由隨機偶然所產生。
        * **方向指標**：正負號反映了關係的方向。正數 (+) 代表正向促進人氣；負數 (-) 則代表該風格在該市場中可能產生人氣阻礙。
    * **P 值 (P-value)**：
        * 衡量「純屬巧合」的概率。通常以 **0.05** 為門檻：
            * $P < 0.05$：代表店名風格對人氣的影響在統計上是**顯著**的。
            * $P > 0.05$：代表目前的趨勢有機會只是**隨機波動**。

    ### 🎯 殘差分析 (Residual Analysis)

    本研究利用殘差分析驗證 **RLM (穩健迴歸) 模型** 的必要性與準確性：

    * **識別極端值的干擾**：透過計算各區實際值與預測值的差距（殘差），發現**旺角**與**油尖**具備極高的正殘差。在傳統迴歸模型中，這些極端值會產生巨大的槓桿作用，強行拉歪趨勢線，導致整體預測失真。
    * **證明 RLM 的準確性**：殘差分佈顯示 RLM 成功降低了離群點的權重，將重心放在其餘大部分行政區的真實趨勢上。這證明模型能精準捕捉店名風格與人氣的底層規律，而不被個別旺區的地理紅利所誤導。
    * **異常值的商業啟發**：殘差極高並不代表模型錯誤，反而成功抽離出模型無法解釋的外部變量。這證實了在**核心商圈**，地利優勢會蓋過品牌風格；但在**非核心區域**，食字命名的「人氣落差」趨勢則更具參考價值。
  conclusion: |
    ## 💡 研究結論：店名真的決定人氣嗎？

    * **平價餐廳**：數據打破了「店名越有趣、生意越好」的迷思。無論是看整體分佈還是剔除極端值後的趨勢，**食字店名的評論數都顯著落後於標準店名**。這顯示在預算有限的市場，消費者可能更偏好直觀、專業的品牌呈現，過於花巧的名稱反而可能成為阻礙。
    * **中高價餐廳**：數據出現有趣的反轉，雖然食字店名在全港整體而言無明顯優勢，但在食字風氣盛行的區域，這類店名的表現反而更好。這說明了**消費聚落效應**的存在：當一個地區形成了特定的命名文化，選擇食字店名更能產生品牌聯想，借力打力吸收地區流量。
    * **地理紅利**：旺角與油尖區的餐廳實際評論數量遠超模型預期。這說明**核心商圈帶來的地理紅利和人流基礎，其影響力遠高於店名風格的設計**。
  reflection: |
    ## 🔄 研究反思

    ### ⚠️ 現有研究局限
    * **數據篩選邏輯的偏誤**：
        目前的數據抓取邏輯主要依賴店名中是否包含「泰」或「Thai」等關鍵字進行初步篩選。這會導致部分實際經營泰國菜、但店名中不含相關關鍵字的餐廳被排除在外。未來需調整篩選方式，例如改以 Google 提供的 `primary_type` 標籤為主要分類依據，以獲取更全面的樣本。
    * **樣本量與整合流失**：
        受限於數據清洗與地址解析後的有效樣本數（目前為 **{total_restaurants_count}間**），部分區域的統計顯著性仍有待提高。數據流失主要源於 CSDI 空間數據與 Google API 之間的匹配誤差。
    * **分店與連鎖效應的干擾**：
        部分餐廳 (如：*泰潮*）擁有品牌歷史與連鎖資源的餐廳，其商業表現或受品牌紅利影響。目前分析難以將資源優勢與單純的「命名風格」完全隔離，導致模型在處理連鎖店數據時可能存在偏差。
    
    ### 🛣️ 未來研究方向
    * **優化數據整合流程**：
        進一步優化 **CSDI 空間數據**與 **Google Places API** 的自動化對接邏輯，減少因地址匹配失敗而產生的數據流失，從而擴大有效樣本數，提高模型的預測精準度。
    * **深入探討區域消費特性**：
        進一步挖掘不同區域的特色，例如研究傳統泰國菜聚落的**九龍城區**，為何未能享受**旺角及油尖區**的地理紅利；或引入各區人口年齡結構與人均收入數據，是否對「食字命名」有更高的接受度與轉化率。
    * **導入自動化命名分類**：
        目前店名分類主要依賴人工標籤，難以處理大規模數據。未來計劃引入**自然語言處理**技術，透過語義理解自動識別諧音雙關，甚至細分出「創意食字」、「文化符號」或「人名店名」等多重類別，實現更具文化語境的自動化分析。
