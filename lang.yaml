en:
  page_title: "HK Thai Pun Branding Research"
  select_lang: " 🌐 切換語言"
  title: "🇹🇭 Pun Intended? A Data Analysis of Naming Styles on Thai Restaurant Popularity in Hong Kong"
  intro: |
      "**Puns**" (wordplay) are prevalent in Hong Kong's cultural landscape. This is especially evident in Thai restaurants, as the Cantonese word for "**Thai**" (**泰**, *taai3*) is homophonous with "**too/extremely**" (**太**, *taai3*). While these interesting names are frequently featured on digital media platforms, does this cultural appeal translate into actual **business performance**?
        
      This study compares "**Pun**" vs. "**Standard**" naming strategies by integrating official license data from the **FEHD** (via **CSDI**) with metrics from the **Google Places API**, including **Rating**, **Review Count** and **Price Level**.
  overview_heading: "🍽 Overview of Analyzed Restaurants"
  overview_1: "🔎 Naming Overview"
  overview_1_insight: |
    * **Sample Composition:** Among the {total_restaurants_count} restaurants included in this study, **{pun_count}** are named using "Puns" (wordplay), accounting for **{pun_percent:.1f}%** of the total sample. This means, on average, 1 out of every **{denominator:.0f}** Thai restaurants adopts a pun-based naming strategy.
    * **Pun Examples**: "Thai Simple" (泰簡單, *taai3 gaan2 daan1*), "Thai Delicious" (泰好味 *taai3 hou2 mei6*), "Thai Style Eat" (泰式食 *taai3 sik1 sik6*)
  overview_2: "📍 By District"
  overview_2_insight: |
    * **Geographical Distribution:** Consistent with public perception, **Kowloon City** has the highest concentration of Thai restaurants in Hong Kong, but its proportion of pun-based naming is relatively low.
    * **Naming Trends:** Puns are used in more than half of the Thai restaurants in Yuen Long, Tsuen Wan, Kwai Tsing, North District, Tuen Mun, Sha Tin, Sham Shui Po, Central & Western, Wong Tai Sin, and Tai Po. This suggests that **pun-based naming style is most prevalent in the New Territories**.
  overview_3: "🗺️ Restaurant Map"
  show_all: "📋 Show {total_restaurants_count} Thai Restaurant Records"
  data_methodology: "🛠️ Data Processing and Methodology"
  overview_remark: |
    ### ⚙️ Data Collection & Cleaning

    * **Multi-source Integration**: This study is built on **CSDI spatial data**, integrating key metrics such as ratings, review counts, and price levels retrieved via the **Google Places API (New)**.
    * **Automated Filtering**: Restaurants were categorized using Google API's type tags (`primary_type` and `types`). Data entries containing the keyword "Thai" but not serving Thai cuisine (e.g., Din Tai Fung (鼎泰豐), Tai Cheong Bakery (泰昌餅家) were systematically excluded.
    * **Manual Validation**: Edge cases difficult for automated detection and permanently closed restaurants were manually verified, renamed, or removed to ensure the accuracy of the analysis.
    * **Naming Classification**: A custom logic was applied to categorize restaurant names into three groups: **"Standard"**, **"Pun"**, and **"English"**.

    ### ⚠️ Data Limitations

    * **Sample Bias**: As the initial data extraction used "Thai / 泰" as a keyword filter, restaurants that serve Thai cuisine but do not include these keywords in their names may be omitted. Consequently, the **"Pun" ratio in this report may be slightly higher than the actual market average**.
    * **API Search Constraints**: Due to search mechanism limitations, significant discrepancies between Google and CSDI names, or duplicate restaurant names, may cause matching errors. **Ambiguous samples have been manually excluded; however, this has reduced the total sample size and introduced a degree of subjective judgment**.
    * **Temporal Relevance**: This dataset reflects market conditions as of **April 2026** and does not account for subsequent openings or closures.
  google_heading: "📣 Impact of Naming Styles on Reputation and Popularity"
  google_1: "⭐ Rating"
  google_1_insight: |
    * **Rating Performance**: The **median rating** across all naming styles falls within the **3.9–4.0 range**. This indicates that while pun-based names are deeply rooted in local culture, their actual reputation shows no significant deviation from standard naming conventions.
  google_2: "💬 Review Count"
  google_2_insight: |
    * **The Popularity Shortfall**: Data reveals that the **average review count for pun-based names is significantly lower** than that of standard and English names. Taking review volume as a proxy for popularity, these statistical results **challenge the common perception that humorous names are more approachable or effective at attracting customers**.
  tooltip: "ℹ️\n\nChart\n\nGuide"
  tooltip_boxplot: |
    * **Boxplot Explained**:
      * **Core Range**: The lower edge, center line, and upper edge of the box represent the **Lower Quartile (Q1)**, **Median (Q2)**, and **Upper Quartile (Q3)**, respectively. This range captures the central 50% of the restaurants in the sample.
      * **Data Ranges & Outliers**: The extended **whiskers** illustrate the normal boundaries of the data. **Points beyond the upper fence (Outliers)** represent high-popularity restaurants with significant growth potential.
  google_remark: |
    ### ⚙️ Data Cleaning
    * **Outlier Handling**: Prior to finalizing the research dataset ($n={total_restaurants_count}$), **2 invalid samples with a rating of 0 were excluded**. Such samples typically represent restaurants that have not yet accumulated sufficient ratings; removing them ensures that the overall distribution more accurately reflects genuine **market sentiment** and reputation.
  price_level_heading: "💰 Is Price Level a Confounding Factor?"
  price_level_insight: |
    * **Heatmap Guide:**
      * **Correlation Validation**: Values range from -1 (perfect negative correlation) to 1 (perfect positive correlation).
      * **Review and Pun**: Review count and pun-based names show a negative correlation ($R=-0.21$), meaning restaurants with **pun-based names tend to receive fewer comments**.
      * **Review and Price**: Review count and price level show a stronger positive correlation ($R=0.55$), meaning **price level is a significant confounding factor of review count**.
    * **Price Level Analysis:**
      * **Price Polarization**: {total_restaurants_count} restaurants are highly concentrated at two extremes: **Budget Restaurants (Level 0)** and **Mid-to-High End Restaurants (Level 3)**. Subsequent analysis will adopt a "Stratified Strategy," **independently verifying these two price groups**.
      * **Naming Conventions**: The proportion of pun-based names in **Mid-to-High End Restaurants (Level 3)** is notably lower than that of standard names. This suggests that budget restaurants lean toward the approachability of puns to connect with the general public, whereas higher-end restaurants often opt for standard or English names to convey a sense of brand authority and formality.
  price_level_1: "Heatmap (Correlation of All Factors)"
  price_level_2: "Restaurant Count of Different Price Levels"
  price_level_2_1: "🔠 By Naming Style"
  price_level_2_2: "📍 By District"
  price_level_breakdown_heading: "🪙 Stratified Verification of Price Levels"
  price_level_breakdown_insight: |
    * **Persistent Performance Shortfall in Puns**: While previous analysis suggests that budget restaurants lean toward puns to build approachability, data shows that this naming strategy **does not translate into a tangible competitive advantage**. Across all price levels, **ratings and review counts for restaurants with pun-based names remain consistently lower than those with standard names**, proving that humor does not guarantee market popularity.
    * **Sustained Correlation between Price and Review Count**: Consistent with the heatmap findings, review counts show a strong positive correlation with price levels. This is further reflected in the Mid-to-High End (Level 3) Review Count Box Plot: **Level 3 restaurants get higher review counts than Level 0 and the overall benchmark**. Within Level 3, **restaurants with standard names continue to lead in review counts**.
    * **Subsequent Research Direction**: To eliminate price-related interference, subsequent analysis will continue to separate Budget (Level 0) and Mid-to-High End (Level 3) restaurants, and to explore the **commercial performance across different districts**.
  price_breakdown_1: "⭐ Rating Distribution (By Price Level)"
  price_breakdown_2: "💬 Review Count Distribution (By Price Level)"
  price_breakdown_1_1: "Overall Rating"
  price_breakdown_1_2: "Budget Restaurants (Level 0) Rating"
  price_breakdown_1_3: "Mid-to-High End Restaurants (Level 3) Rating"
  price_breakdown_2_1: "Overall Review Count"
  price_breakdown_2_2: "Budget Restaurants (Level 0) Review Count"
  price_breakdown_2_3: "Mid-to-High End Restaurants (Level 3) Review Count"
  price_remark: |
    ### 💰 Price Level Definitions
    
    This study utilizes the raw Google API price tiers (0-4) as a foundation, categorized by the following **operational definitions** to align with the consumption characteristics of the Hong Kong market:
    * **Level 0**: Defined as **Budget Restaurants** (Original API label: *Free/Unclassified*). In this HK Thai cuisine sample, this category primarily covers mass-market eateries, takeaways, and small neighborhood bistros.
    * **Level 3**: Defined as **Mid-to-High End Restaurants** (Original API label: *Expensive*), reflecting restaurants with a certain scale of service and premium interior standards.
    * **Levels 1, 2, 4**: Due to scattered or extreme sample distributions, these tiers serve as supplementary background data for the model.
  price_corr_heading: "🧩 Data Decoded: The Survival Logic of Naming—From Budget to High-End Markets"
  price_corr_insight: |
    * **Metrics & Methodology**
      * **Price Stratification**: To eliminate price positioning as a confounding variable, the analysis performs independent validations on **Budget (Level 0)** and **Mid-to-High End (Level 3)** segments.
      * **Focus on Review Count**: Heatmap analysis indicates that Pun-based naming has a stronger correlation with **review count** ($r = -0.21$) than with **rating** ($r = -0.04$). Consequently, this study focuses on review count to gauge a brand's attraction and virality.
      * **Analytical Logic**: Using the "Pun-based Naming Ratio" per district as the core metric, the study observes how pun saturation impacts the average popularity (review count) of restaurants in that area.
      * **Model Selection**: **RLM (Robust Linear Model)** was utilized to ensure that trend lines remain undistorted by statistical outliers.

    * **Key Findings: Creative Premium vs. Mediocrity Trap**
      * **Budget (Level 0)**: There is a **negative correlation** between the prevalence of pun-based names and review count. The trend line reveals that for every 10% increase in pun-based restaurants within a district, their **average review count drops by 8.7**. In the mass market, pun-based names may be perceived as "cliché" or lacking brand depth, effectively becoming a **negative label**. Furthermore, **severe homogenization** (e.g., a high density of repetitive pun-based names) makes it difficult for diners to distinguish between brands, causing popularity to decline as the market becomes saturated.
      * **Mid-to-High End (Level 3)**: The trend reverses completely, showing a **significant positive correlation**. For every 10% increase in pun-based names, their **average review count rises by 29**. High-end consumers are more likely to be drawn to creativity and wit. In this segment, pun-based naming is a tool for brand differentiation, demonstrating a strong pull on high-end diners.
      * **Outlier Identification**: Actual review counts in **Mong Kok (Level 0)** and **Yau Tsim (Level 3)** far exceed model predictions. This highlights how the geographic advantage of prime districts is so dominant that it overrides naming strategies. This also validates the importance of using the RLM model to filter out noise and capture core market trends.
  price_corr_1: "📉 Price Level 0: How Pun-Saturation Dilutes Mass Market Appeal"
  price_corr_2: "📈 Price Level 3: Leveraging Creative Wit for High-End Brand Attraction"
  show_price_stratification: "📋 Show Price Level Stratification of Thai Restaurants by District"
  price_strat_1: "📉 Price Level 0"
  price_strat_2: "📈 Price Level 3"
  price_corr_remark: |
    ### ⚙️ Data Processing & Sample Filtering

    * **Level 0 (Budget)**: Hong Kong was originally divided into 19 districts (some government datasets still treat Mong Kok and Yau Tsim as separate districts rather than a unified Yau Tsim Mong district). However, as Sai Kung, Islands, and Southern District lacked budget Thai restaurants meeting our "Pun-based" naming criteria, the final sample size for regression was narrowed to **16 districts**.
    * **Level 3 (Mid-to-High End)**: Due to the scarcity of high-end Thai restaurants utilizing pun-based names, only **6 districts** met the statistical threshold. While the resulting trendline is statistically significant ($P < 0.05$), caution is advised when generalizing these findings to the broader market, as the results may be influenced by specific district-level outliers.

    ### 📊 Statistical Indicator Glossary

    * **Z-statistic**
        * **Signal Strength**: Measures the impact of a variable. A larger absolute value indicates a stronger influence of the naming style on popularity, suggesting the result is unlikely to be a product of random chance.
        * **Directional Indicator**: The sign reflects the nature of the relationship. A **positive (+) value** indicates an increase in popularity, while a **negative (-) value** suggests the naming style may hinder market appeal in that segment.
    * **P-value**
        * Measures the **probability of random occurence**. Using **0.05** as the standard threshold:
            * **$P < 0.05$**: The impact of naming style on popularity is considered **statistically significant**.
            * **$P > 0.05$**: The observed trend may simply be the result of **random noise**.

    ### 🎯 Residual Analysis

    This study utilizes residual analysis to validate the necessity and accuracy of the **RLM (Robust Linear Model)** approach:

    * **Identifying Outlier Interference**: By calculating the "Residuals" (gap between actual and predicted values), we identified that **Mong Kok** and **Yau Tsim** exhibit extremely high positive residuals. In traditional OLS regression, these outliers would exert massive "leverage," forcing the trendline toward them and distorting the overall market prediction.
    * **Proving RLM Accuracy**: The residual distribution demonstrates that RLM successfully downweighted these outliers, focusing on the true trends of the remaining districts. This proves the model's ability to capture the underlying relationship between naming style and popularity without being misled by the geographic traffic dividends of specific hotspots.
    * **Business Insights from Deviations**: A high residual does not imply model failure; rather, it isolates external variables the model cannot explain. This confirms that in **prime commercial hubs**, location advantage outweighs branding style; however, in **non-core areas**, the "Popularity Shortfall" of pun-based naming remains a highly reliable strategic reference.
  conclusion: |
    ## 💡 Core Insights: Does a Name Truly Drive Popularity?

    * **Budget Restaurants**: The data debunked the myth that "the wittier the name, the better the business". Both overall distribution in box plots and the RLM trendlines adjusted for outliers showed that **pun-based names significantly lagged behind standard names in review counts**. This suggests that in budget-sensitive markets, consumers prefer intuitive and professional branding; overly clever names may actually act as a barrier to entry.
    * **Mid-to-High End Restaurants**: The data revealed a surprising reversal. While pun-based naming showed no clear advantage on a territory-wide scale, it performed significantly better in districts where "pun culture" is already prevalent. This highlights the **"Cluster Effect"**: when a district develops a specific naming subculture, choosing a pun-based name fosters stronger brand association, allowing a restaurant to leverage existing local momentum to attract traffic.
    * **The Dominance of Location**: Restaurants in Mong Kok and Yau Tsim districts outperformed model predictions. This confirms a fundamental pillar of F&B: The Dominance of Location: High-traffic business hubs provide a **geographic advantage that far exceeds the influence of naming style**.
  reflection: |
    ## 🔄 Research Reflections

    ### ⚠️ Current Limitations
    * **Selection Bias in Data Retrieval**: The current data scraping logic primarily relies on keywords like "Thai" or "泰" in restaurant names. This inevitably excludes Thai restaurants that do not use these specific terms in their branding. Future iterations should utilize Google’s `primary_type` or `cuisine_category` tags as the primary filter to ensure a more comprehensive and representative sample.
    * **Sample Size and Integration Attrition**: With a post-cleaning sample size of **{total_restaurants_count} restaurants**, the statistical significance within certain districts remains limited. This data attrition is largely due to matching errors between CSDI spatial data and the Google Places API (e.g., inconsistent address formatting).
    * **Distortion from Chain and Brand Equity**: Established brands (e.g., *Thai Chiu*) benefit from significant brand equity and shared corporate resources that support their business performance. Currently, it is difficult to isolate these resource advantages from the naming style itself, which may introduce bias when the model processes data from multi-branch chains.

    ### 🛣️ Future Roadmap
    * **Optimizing Data Integration Pipeline**: Refining the automated matching logic between **CSDI spatial data** and **Google Places API** will be critical. By implementing fuzzy matching for addresses, we can reduce data loss, expand the effective sample size, and improve the predictive accuracy of the model.
    * **Deep Dive into District Consumer Demographics**: Further exploration could uncover the unique characteristics of different districts, e.g. why traditional Thai food hubs like **Kowloon City** do not enjoy the same geographic advantage as **Mong Kok or Yau Tsim**. Incorporating demographic variables, such as age structure and median income, could reveal whether specific populations have a higher cultural receptivity to pun-based naming.
    * **Implementation of Automated Taxonomy**: The current manual labeling is insufficient for large-scale datasets. Future phases will integrate **Natural Language Processing (NLP)** to automate the identification of paronomasia (puns). This will allow for a more **culturally-contextualized automated analysis** of names by categorizing them into "creative puns," "cultural symbols," or "proper nouns".
